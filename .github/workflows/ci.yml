name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  actions-lint:
    name: Tests statiques des workflows GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation de yamllint et zizmor
        run: pip install --upgrade yamllint zizmor

      - name: Lint YAML des workflows (yamllint)
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 160, level: warning}, document-start: disable, truthy: {check-keys: false}, comments: {min-spaces-from-content: 1}}}' \
            .github/workflows/

      - name: Installation d'actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint des workflows (actionlint + shellcheck)
        run: actionlint -color

      - name: Audit de sécurité des workflows (zizmor)
        run: zizmor --persona=regular .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node-checks:
    name: Vérifications Node.js
    runs-on: ubuntu-latest
    needs: actions-lint
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit de sécurité des chemins
        run: npm run audit:path

      - name: Tests unitaires & intégration
        run: npm test

  docker-build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: [actions-lint, node-checks]
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: app-statique:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

